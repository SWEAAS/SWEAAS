# Deploy frontend to AWS Amplify Hosting on push to main (frontend paths).
#
# Amplify app `d3rw7tzkg9y12a` is NOT connected to a Git provider — it is a
# manual-deploy app. That means we can't use `amplify:StartJob` (which requires
# a Git-connected app); we have to build the dist locally, zip it, and push it
# in via `CreateDeployment` + `StartDeployment`.
#
# Flow:
#   1. Build the app in CI — this is the authoritative build since Amplify
#      doesn't rebuild on its side.
#   2. Zip frontend/dist → dist.zip
#   3. `aws amplify create-deployment` to get a presigned S3 URL + jobId.
#   4. `curl -T dist.zip <presigned-url>` to upload the bundle.
#   5. `aws amplify start-deployment` with the jobId.
#   6. Poll `get-job` until SUCCEED or FAILED so the Actions run reflects
#      actual CDN state.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   AWS_ACCESS_KEY_ID
#   AWS_SECRET_ACCESS_KEY
#     IAM user needs: amplify:CreateDeployment, amplify:StartDeployment,
#     amplify:GetJob on app d3rw7tzkg9y12a.
#   VITE_SUPABASE_URL              — baked into the bundle at build time
#   VITE_SUPABASE_PUBLISHABLE_KEY
#   VITE_SENTRY_DSN                — optional

name: Deploy Frontend to AWS Amplify

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  AMPLIFY_APP_ID: d3rw7tzkg9y12a
  AMPLIFY_BRANCH: main
  VITE_API_BASE_URL: https://api.sweaas.com/api/v1

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint
        continue-on-error: true # advisory — don't block deploy on lint warnings

      - name: Build production bundle
        working-directory: frontend
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
        run: |
          # Diagnostic: confirm that Node actually sees the secrets in process.env.
          # Prefix-only output so GH's log masker doesn't redact everything.
          node -e '
            const keys = ["VITE_API_BASE_URL","VITE_SUPABASE_URL","VITE_SUPABASE_PUBLISHABLE_KEY","VITE_SENTRY_DSN"];
            for (const k of keys) {
              const v = process.env[k];
              if (v && v.length > 0) {
                console.log(k + " length=" + v.length + " starts_https=" + v.startsWith("https://") + " starts_sb=" + v.startsWith("sb_"));
              } else {
                console.log(k + " UNSET");
              }
            }
          '
          # frontend/vite.config.ts reads process.env.VITE_* directly and wires
          # them into Vite's `define`, which guarantees inlining regardless of
          # node-version flakiness in Vite's own env loader. The step env vars
          # above are the only source — no shim .env needed.
          npm run build
          ls -la dist/ | head
          du -sh dist

          # Post-build sanity: confirm the Supabase URL actually got inlined
          # so we fail loudly in CI instead of silently shipping a broken bundle.
          if ! grep -rq 'supabase\.co' dist/assets/*.js 2>/dev/null; then
            echo "::error title=Build sanity check failed::No supabase.co URL found in built bundle — VITE_SUPABASE_URL did not inline"
            exit 1
          fi
          echo "::notice title=Build sanity check passed::Supabase URL is inlined in dist/"

          # Post-build sanity: the 3D HQ scene loads the Building GLB from
          # /models/Building7EEVEE.glb. If Vite's public-dir copy silently
          # dropped it (previous deploys shipped a 8.6 MB zip with an empty
          # dist/models/, breaking the /welcome-hw page), fail the deploy
          # loudly.
          echo "--- dist/models/ ---"
          ls -la dist/models/ 2>/dev/null || echo "(dist/models/ missing entirely)"
          if [ ! -s dist/models/Building7EEVEE.glb ]; then
            echo "::error title=Build sanity check failed::dist/models/Building7EEVEE.glb is missing or empty after vite build. Public-dir copy failed; the /welcome-hw page will break in prod."
            echo "--- for diagnostic: public/models/ ---"
            ls -la public/models/ 2>/dev/null || echo "(public/models/ missing)"
            echo "--- file sizes in public/ after checkout ---"
            find public -type f -exec ls -la {} \;
            exit 1
          fi
          BUILDING_SIZE=$(wc -c < dist/models/Building7EEVEE.glb)
          if [ "$BUILDING_SIZE" -lt 1000000 ]; then
            echo "::error title=Build sanity check failed::dist/models/Building7EEVEE.glb is only ${BUILDING_SIZE} bytes (expected >1MB). Likely an LFS pointer or the SPA fallback."
            exit 1
          fi
          echo "::notice title=Build sanity check passed::Building GLB present (${BUILDING_SIZE} bytes)"

      - name: Create deployment artifact
        working-directory: frontend
        run: |
          cd dist
          zip -rq ../dist.zip .
          cd ..
          ls -la dist.zip

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create Amplify deployment (get presigned upload URL)
        id: amplify_create
        run: |
          JSON=$(aws amplify create-deployment \
            --app-id "$AMPLIFY_APP_ID" \
            --branch-name "$AMPLIFY_BRANCH" \
            --region "$AWS_REGION" \
            --output json)
          echo "$JSON"
          JOB_ID=$(echo "$JSON" | jq -r '.jobId')
          UPLOAD_URL=$(echo "$JSON" | jq -r '.zipUploadUrl')
          if [ -z "$JOB_ID" ] || [ "$JOB_ID" = "null" ]; then
            echo "::error title=Amplify create-deployment failed::no jobId in response"
            exit 1
          fi
          echo "job_id=${JOB_ID}" >> "$GITHUB_OUTPUT"
          # Keep the presigned URL as a masked env var so it isn't echoed into logs.
          echo "::add-mask::$UPLOAD_URL"
          echo "UPLOAD_URL=${UPLOAD_URL}" >> "$GITHUB_ENV"

      - name: Upload dist.zip to Amplify
        working-directory: frontend
        run: |
          HTTP=$(curl -sS -o /tmp/upload.out -w '%{http_code}' \
            -H "Content-Type: application/zip" \
            -T dist.zip "$UPLOAD_URL")
          echo "upload response: HTTP $HTTP"
          if [ "$HTTP" != "200" ]; then
            echo "::error title=Amplify upload failed::HTTP $HTTP"
            cat /tmp/upload.out
            exit 1
          fi

      - name: Start Amplify deployment
        env:
          JOB_ID: ${{ steps.amplify_create.outputs.job_id }}
        run: |
          aws amplify start-deployment \
            --app-id "$AMPLIFY_APP_ID" \
            --branch-name "$AMPLIFY_BRANCH" \
            --job-id "$JOB_ID" \
            --region "$AWS_REGION" \
            --output json
          echo "Started deployment job $JOB_ID"

      - name: Wait for Amplify deployment to finish
        env:
          JOB_ID: ${{ steps.amplify_create.outputs.job_id }}
        run: |
          for i in $(seq 1 80); do
            STATUS=$(aws amplify get-job \
              --app-id "$AMPLIFY_APP_ID" \
              --branch-name "$AMPLIFY_BRANCH" \
              --job-id "$JOB_ID" \
              --region "$AWS_REGION" \
              --query 'job.summary.status' --output text)
            echo "[$i] status=$STATUS"
            case "$STATUS" in
              SUCCEED)
                echo "::notice title=Amplify deploy succeeded::job $JOB_ID — https://${AMPLIFY_BRANCH}.${AMPLIFY_APP_ID}.amplifyapp.com (also sweaas.com via custom domain)"
                exit 0
                ;;
              FAILED|CANCELLED)
                echo "::error title=Amplify deploy $STATUS::job $JOB_ID — check Amplify console for details"
                exit 1
                ;;
            esac
            sleep 15
          done
          echo "::error title=Amplify deploy timed out::job $JOB_ID did not finish within 20 minutes"
          exit 1
